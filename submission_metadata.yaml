  A two-stage hybrid retriever and ranker. Uses BGE-small-en-v1.5 embeddings for fast retrieval of the Top 500 candidates. Reranking utilizes a comprehensive score fusion scoring candidate experience (5-9 yrs), education, core skills (penalized if duration=0), and behavioral signals. Screens out over 18,000 spam profiles and programmatically eliminates the 56 honeypot trap candidates with structural anomalies. Complete execution finishes in under 2 seconds.

